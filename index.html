          Object.defineProperty(window, "fetch", {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (window.Window && window.Window.prototype);
            if (proto) {
              var protoFetch = proto.fetch ? proto.fetch.bind(window) : window.fetch;
              Object.defineProperty(proto, "fetch", {
                get: function() { return protoFetch; },
                set: function(v) { protoFetch = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
